[build-system]
requires = ["setuptools>=66.1.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psycho-py"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128.0",
    "pydantic-settings>=2.12.0",
    "uvicorn>=0.40.0",
    "transformers>=4.34.0",
    "torch>=2.2.0",
    "accelerate>=1.12.0",  # CUDA device_map="auto" 사용 시 필요
    "pytest>=9.0.2",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
]
monitor = [
    "psutil>=5.9.0",  # 리소스 사용량(CPU, RAM) 출력용
]

[tool.setuptools]
packages = ["model"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"  # asyncio 테스트 자동 감지 (STRICT보다 유연함)
addopts = [
    "-v",
    "--tb=short",
    "--durations=0",  # 모든 테스트의 실행 시간 표시
    "-s",  # print 출력 표시
]
